[project]
name = "rdf-kg-mcp"
version = "0.2.0"
description = "Serve a versioned, pre-reasoned RDF knowledge-graph bundle read-only over the Model Context Protocol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rewire contributors" }]
keywords = ["rdf", "sparql", "owl", "knowledge-graph", "mcp", "oxigraph", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.3,<3",
    "pyoxigraph>=0.5.11,<0.6",
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/rewire-bio/rdf-kg-mcp"
Issues = "https://github.com/rewire-bio/rdf-kg-mcp/issues"

[project.scripts]
rdf-kg-mcp = "rdf_kg_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
